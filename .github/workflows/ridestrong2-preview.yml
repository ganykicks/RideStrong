name: Build RideStrong 2.0 audio previews

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ridestrong2-preview.yml"
      - "scripts/ridestrong2_audio.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-audio.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: pip install -r scripts/requirements-audio.txt
      - name: Prepare six full-length preview workouts
        run: python scripts/ridestrong2_audio.py
      - name: Verify preview files
        run: |
          test -s v2_preview/index.html
          test -s v2_preview/countdown_sample.mp4
          test "$(find v2_preview -maxdepth 1 -name '*_30min.mp4' | wc -l)" -eq 6
      - name: Upload previews as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ridestrong-v2-audio-previews
          path: v2_preview/
          retention-days: 7
      - name: Publish under /v2_preview/ without replacing existing videos
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add v2_preview/
          if git diff --cached --quiet; then
            echo "Preview is already up to date"
          else
            git commit -m "Add RideStrong 2.0 AI female voice and music previews"
            git push origin HEAD:main
          fi
